name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-sagy-sandbox
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets --locked
      - name: Cargo clippy check
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Cargo test
        run: cargo test --all-targets --locked
      - name: Cargo build
        run: cargo build --release --locked

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-sagy-sandbox
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Cargo test on native Windows
        run: cargo test --all-targets --locked
      - name: Windows state save and replacement smoke test
        run: cargo test --test windows_runtime --locked
      # harness 需要一份真实的 sagy.exe 作为"归档里的二进制"，否则会退回文本占位，
      # 成功路径就只证明了"能装上一个文本文件"。显式构建让这份依赖不再靠运气。
      - name: Build the sagy binary for the installer harness
        run: cargo build --locked
      - name: Windows installer fail-closed checksum harness
        shell: pwsh
        env:
          SAGY_TEST_BINARY: ${{ github.workspace }}\target\debug\sagy.exe
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/p0_checksum.ps1
          # harness 的每一条断言都是 throw，只体现在子进程退出码上。
          # 不显式转成 step 失败，job 会带着失败的 harness 一路变绿。
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
