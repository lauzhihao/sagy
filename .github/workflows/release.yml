name: release

on:
  push:
    tags:
      - "v*"

# 顶层只读；只有 publish job 会显式抬到 contents: write。
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version-guard:
    runs-on: ubuntu-latest
    env:
      HOME: ${{ runner.temp }}/sagy-home
      SAGY_HOME: ${{ runner.temp }}/sagy-state
      GEMINI_HOME: ${{ runner.temp }}/gemini-home
      ANTIGRAVITY_CONFIG_DIR: ${{ runner.temp }}/antigravity-config
      CARGO_HOME: ${{ runner.temp }}/cargo-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Verify release tag matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo package version ${package_version}." >&2
            exit 1
          fi

  quality:
    needs: version-guard
    runs-on: ubuntu-latest
    env:
      HOME: ${{ runner.temp }}/sagy-home
      SAGY_HOME: ${{ runner.temp }}/sagy-state
      GEMINI_HOME: ${{ runner.temp }}/gemini-home
      ANTIGRAVITY_CONFIG_DIR: ${{ runner.temp }}/antigravity-config
      CARGO_HOME: ${{ runner.temp }}/cargo-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --all-targets --locked
      - name: Cargo clippy check
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Cargo test
        run: cargo test --all-targets --locked
      - name: Cargo build
        run: cargo build --release --locked

  windows-runtime:
    needs: version-guard
    runs-on: windows-latest
    env:
      HOME: ${{ runner.temp }}\sagy-home
      SAGY_HOME: ${{ runner.temp }}\sagy-state
      GEMINI_HOME: ${{ runner.temp }}\gemini-home
      ANTIGRAVITY_CONFIG_DIR: ${{ runner.temp }}\antigravity-config
      CARGO_HOME: ${{ runner.temp }}\cargo-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Cargo test on native Windows
        run: cargo test --all-targets --locked
      - name: Windows state save and replacement smoke test
        run: cargo test --test windows_runtime --locked
      # harness 需要一份真实的 sagy.exe 作为"归档里的二进制"，否则会退回文本占位，
      # 成功路径就只证明了"能装上一个文本文件"。显式构建让这份依赖不再靠运气。
      - name: Build the sagy binary for the installer harness
        run: cargo build --locked
      - name: Windows installer fail-closed checksum harness
        shell: pwsh
        env:
          SAGY_TEST_BINARY: ${{ github.workspace }}\target\debug\sagy.exe
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/p0_checksum.ps1
          # harness 的每一条断言都是 throw，只体现在子进程退出码上。
          # 不显式转成 step 失败，job 会带着失败的 harness 一路变绿。
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    needs: [version-guard, quality, windows-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            bin_name: sagy
          - os: macos-14
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: sagy
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: sagy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: sagy.exe
    runs-on: ${{ matrix.os }}
    env:
      HOME: ${{ runner.temp }}/sagy-home
      SAGY_HOME: ${{ runner.temp }}/sagy-state
      GEMINI_HOME: ${{ runner.temp }}/gemini-home
      ANTIGRAVITY_CONFIG_DIR: ${{ runner.temp }}/antigravity-config
      CARGO_HOME: ${{ runner.temp }}/cargo-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.bin_name }}
          tar -C dist -czf sagy-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.bin_name }}
      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.bin_name }}"
          Compress-Archive -Path "dist/${{ matrix.bin_name }}" -DestinationPath "sagy-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sagy-${{ matrix.target }}
          path: sagy-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    # 唯一需要写权限的 job：softprops/action-gh-release 要创建 release 并上传资产。
    # 显式声明 permissions 会把未列出的 scope 全部降为 none，因此这里只保留 contents: write。
    # 该 job 不 checkout 源码、不跑构建，只消费上游 artifact 并发布。
    permissions:
      contents: write
    env:
      HOME: ${{ runner.temp }}/sagy-home
      SAGY_HOME: ${{ runner.temp }}/sagy-state
      GEMINI_HOME: ${{ runner.temp }}/gemini-home
      ANTIGRAVITY_CONFIG_DIR: ${{ runner.temp }}/antigravity-config
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release_assets/*
